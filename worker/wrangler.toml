name = "vpn-list"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 自定义域名：部署时由 Cloudflare 自动创建 DNS 记录与证书（需该域名已托管在同一账号）
routes = [{ pattern = "go4sharing.gv.uy", custom_domain = true }]

# 前端静态文件（web/dist）与 API 由同一个 Worker 提供
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application" # 前端路由刷新不 404
run_worker_first = true                        # 所有请求先进 Worker，非 /api 的转给静态资源

# 先执行：npx wrangler d1 create vpn-list，把返回的 database_id 填到下面
[[d1_databases]]
binding = "DB"
database_name = "vpn-list"
database_id = "4fdc84f9-7452-4837-8374-8a26ccfe2636"

# 投稿图片存放的 GitHub 仓库（公开仓库，图片经 jsDelivr 加速访问）
# 存放规则：{日期}/{机场名}.webp，重名追加数字；令牌用 `wrangler secret put GITHUB_TOKEN` 设置
# GITHUB_REPO 为空时，带图片的投稿会提示“暂未开通”，不带图片的投稿不受影响
[vars]
GITHUB_REPO = "go4sharing/blog-assets"
GITHUB_BRANCH = "main"
GITHUB_IMG_DIR = ""   # 日期文件夹的上级目录，留空则直接放在仓库根目录

# 线上密钥用 `wrangler secret put ADMIN_TOKEN|TURNSTILE_SECRET|IP_SALT` 设置
# 本地开发用 worker/.dev.vars
